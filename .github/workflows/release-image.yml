# Build and publish the harnesssphere image to GHCR.
#
# This exists because zombie-crab-project's docker-compose.prod.yaml names
# ghcr.io/lepistabioinformatics/harness-sphere, and until this workflow ran that
# package did not exist — a prod deploy would have failed on an image pull.
# `release.yml` publishes cross-compiled BINARIES, which is a different artifact
# and does not serve the compose stack.
#
# Mirrors crab-shell-proxy's release-image.yml deliberately: the two images are
# consumed by the same compose file and pinned by the same kind of env var, so
# their tag vocabularies should not diverge.
name: release-image

on:
  push:
    tags: ["v*"]           # publish on version tags, e.g. v1.2.3
    branches: ["main"]     # also publish :main + :sha for the latest default branch
  workflow_dispatch: {}

concurrency:
  group: release-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          # github.repository is <owner>/<repo>; metadata-action lowercases it
          # for GHCR (which rejects uppercase paths).
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
